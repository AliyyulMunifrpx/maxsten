openapi: 3.0.3
info:
  title: Store Queues API (Live Queue)
  description: API to retrieve the store's active queues and update queue statuses by the cashier/seller.
  version: 1.0.0
servers:
  - url: https://example.com
    description: Production Server
tags:
  - name: Store Queues
    description: Management of the store's ongoing queues
paths:
  /api/stores/{storeId}/queues:
    get:
      tags:
        - Store Queues
      summary: Get Store Queues (Live Queue)
      description: |
        Retrieve the store's active queues along with its current open/closed status. Intended for the cashier/live queue dashboard.

        **Notes:**
        - Only queues with the status `BELUM_BAYAR` or `DIPROSES` are returned (completed/cancelled queues are excluded).
        - There is no date restriction; queues from the previous night that are still active will continue to appear.
        - Queues are sorted using **FIFO** (`created_at` ascending).
        - `nextPage` contains prefetched data for the following page.
        - `storeStatus.is_open` does not affect whether queues are returned.
      security:
        - cookieAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          description: The `public_id` of the store.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Page number (Returns 20 queues per page). Default is 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      storeStatus:
                        $ref: "#/components/schemas/StoreStatus"
                      currentPage:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"
                      nextPage:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"
                      pagination:
                        $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized (Not logged in / session expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Unauthorized"
        "404":
          description: Not Found (storeId not found, or does not belong to the authenticated user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Store not found or you don't have access"

  /api/stores/queues/{queueId}:
    patch:
      tags:
        - Store Queues
      summary: Update Queue Status
      description: |
        Update the status of a queue (process, complete, or cancel). 
        Status changes are automatically sent in real-time to the buyer via Socket.IO.

        **State Machine (Allowed transitions):**
        * `BELUM_BAYAR` -> `DIPROSES`, `DIBATALKAN`
        * `DIPROSES` -> `SELESAI`, `DIBATALKAN`
        * `SELESAI` -> *(final status, cannot be changed further)*
        * `DIBATALKAN` -> *(final status, cannot be changed further)*
      security:
        - cookieAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          description: The UUID of the queue.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Queue"
        "400":
          description: Bad Request (Validation failed, required fields are empty, or transition not allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidTransition:
                  value:
                    errors: "Cannot change the status from BELUM_BAYAR to SELESAI"
                ValidationError:
                  value:
                    errors: '"status" must be one of [DIPROSES, SELESAI, DIBATALKAN]'
        "401":
          description: Unauthorized (Not logged in / session expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Unauthorized"
        "404":
          description: Not Found (Queue not found, or storeId does not belong to the logged-in user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Queue not found"
        "409":
          description: Conflict (The queue status was changed between the time the request was read and saved - race condition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "The queue status has changed"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Cookie based authentication (requires `access_token` and `refresh_token`).

  schemas:
    StoreStatus:
      type: object
      properties:
        is_open:
          type: boolean
          example: true
        timezone:
          type: string
          example: "Asia/Jakarta"

    QueueUpdateInput:
      type: object
      required:
        - storeId
        - status
      properties:
        storeId:
          type: string
          format: uuid
          description: The public_id of the store owning the queue
          example: "8b053812-002e-4738-835d-3a1a11af35a5"
        status:
          type: string
          enum: [DIPROSES, SELESAI, DIBATALKAN]
          description: Target status for the transition
          example: "DIBATALKAN"
        reason:
          type: string
          maxLength: 100
          description: Cancellation reason. Only relevant if status is DIBATALKAN.
          example: "Stok habis"

    QueueProduct:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Coffee"
        price:
          type: integer
          example: 15000
        image_url:
          type: string
          nullable: true

    QueueDetail:
      type: object
      properties:
        id:
          type: integer
          example: 900
        quantity:
          type: integer
          example: 1
        selected_addons:
          type: array
          nullable: true
          items:
            type: object
        product:
          $ref: "#/components/schemas/QueueProduct"
        variant:
          type: object
          nullable: true

    Queue:
      type: object
      properties:
        id:
          type: integer
          description: Internal ID of the queue
          example: 42
        queue_number:
          type: integer
          example: 12
        total_price:
          type: integer
          example: 15000
        status:
          type: string
          example: "DIBATALKAN"
        created_at:
          type: string
          format: date-time
          example: "2026-07-27T10:00:00.000Z"
        expired_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-27T11:00:00.000Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
          example: "Stok habis"
        cancelled_by:
          type: string
          nullable: true
          example: "seller"
        note:
          type: string
          nullable: true
        queueDetails:
          type: array
          items:
            $ref: "#/components/schemas/QueueDetail"

    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalRows:
          type: integer
          example: 25
        totalPages:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      properties:
        errors:
          type: string
          example: "Error message from the server"
