openapi: 3.0.3
info:
  title: Cancellation Reason API
  description: >
    API documentation for managing reusable cancellation reason templates
    that sellers can pick from when cancelling a queue (e.g. "Out of
    stock"), instead of typing a reason manually every time. Requires an
    authenticated user who owns a store.
  version: "1.0.0"
servers:
  - url: https://example.com
    description: Production server

tags:
  - name: Cancellation Reasons
    description: CRUD for a store's reusable cancellation reason templates

security:
  - cookieAuth: []

paths:
  /api/seller/cancel-reasons:
    post:
      tags: [Cancellation Reasons]
      summary: Create cancellation reason template
      description: |
        Creates a cancellation reason template for the authenticated user's
        store.

        **Notes:**
        - ⚠️ This endpoint uses the `/api/seller/...` path, unlike most
          other endpoints which follow `/api/stores/...` — make sure to use
          the correct base path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationReasonRequest"
            example:
              reason: Out of stock
      responses:
        "201":
          description: Template created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationReasonResponse"
        "400":
          description: "`reason` is missing or exceeds 255 characters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Unauthorized
        "404":
          description: The authenticated user does not have a store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Store not found
        "409":
          description: A template with the same reason already exists in the same store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: A cancellation reason with this text already exists.

    get:
      tags: [Cancellation Reasons]
      summary: List cancellation reason templates
      description: |
        Retrieves all cancellation reason templates belonging to the
        authenticated user's store.

        **Notes:**
        - `data` is always an array — `[]` if the store has no templates yet.
        - Sorted **newest first**.
        - No pagination — all active templates are returned in a single
          response, since the count per store is typically very small.
      responses:
        "200":
          description: List of templates (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CancellationReasonTemplate"
        "401":
          description: Not authenticated or session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Unauthorized
        "404":
          description: The authenticated user does not have a store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Store not found

  /api/seller/cancel-reasons/{reasonId}:
    patch:
      tags: [Cancellation Reasons]
      summary: Update cancellation reason template
      description: Updates the text of an existing cancellation reason template.
      parameters:
        - name: reasonId
          in: path
          required: true
          description: The template's UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationReasonRequest"
            example:
              reason: Out of raw ingredients
      responses:
        "200":
          description: Template updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationReasonResponse"
        "400":
          description: "`reason` is missing or exceeds 255 characters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Unauthorized
        "404":
          description: >
            The template doesn't exist, was already soft-deleted, or doesn't
            belong to the authenticated user's store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Reason template not found or you do not have access
        "409":
          description: Another active template in the same store already uses the requested text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: A cancellation reason with this text already exists.

    delete:
      tags: [Cancellation Reasons]
      summary: Delete cancellation reason template
      description: |
        Soft-deletes a cancellation reason template.

        **Notes:**
        - Deleting a template does **not** affect existing cancellation
          history that previously used its text — `cancellation_reason` on
          a past queue record is a plain-text snapshot taken at cancellation
          time, not a reference to the template. Deleting the template
          never modifies or removes historical data.
      parameters:
        - name: reasonId
          in: path
          required: true
          description: The template's UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Template soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    example: OK
        "400":
          description: "`reasonId` is not a valid UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: Unauthorized
        "404":
          description: >
            The authenticated user does not have a store, OR the template
            doesn't exist / was already soft-deleted / doesn't belong to the
            authenticated user's store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noStore:
                  value:
                    errors: Store not found
                noTemplate:
                  value:
                    errors: Cancellation reason template not found

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        httpOnly session cookie. Sent alongside the httpOnly `refresh_token`
        cookie (used to auto-renew the session); both are set by the login
        endpoint.

  schemas:
    ErrorResponse:
      type: object
      properties:
        errors:
          type: string
          example: Store not found

    CancellationReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 255
          description: Must be unique among the active templates in the same store.

    CancellationReasonTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    CancellationReasonResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CancellationReasonTemplate"
