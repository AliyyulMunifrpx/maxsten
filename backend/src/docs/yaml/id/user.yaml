openapi: 3.0.3
info:
  title: User Authentication & Profile API
  description: API untuk mengelola registrasi, autentikasi (login/logout), dan manajemen profil akun user.
  version: 1.0.0
servers:
  - url: https://example.com
    description: Production Server
tags:
  - name: Authentication
    description: Endpoint publik untuk otentikasi (Register, Login, Logout)
  - name: User Profile
    description: Endpoint privat (membutuhkan login) untuk manajemen profil akun
paths:
  /api/users:
    post:
      tags:
        - Authentication
      summary: Register User
      description: |
        Mendaftarkan akun user baru.
        Setelah berhasil, user **wajib** melakukan konfirmasi melalui tautan yang dikirim ke email mereka sebelum bisa melakukan login.

        **Catatan Khusus (Frontend):**
        - Jangan langsung arahkan ke Dashboard. Tampilkan pesan "Cek email Anda untuk konfirmasi".
        - Untuk fitur "Kirim Ulang Email", gunakan SDK Supabase langsung: `supabase.auth.resend({ type: "signup", email })`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created (Berhasil mendaftar, menunggu konfirmasi email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request (Email duplikat, format salah, atau ditolak sistem Auth)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                EmailExists:
                  value:
                    errors: "That email address already exists"
                ValidationError:
                  value:
                    errors: '"password" length must be at least 8 characters long'
        "500":
          description: Internal Server Error (Gagal menyimpan ke database lokal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Melakukan autentikasi menggunakan email dan password.
        Sesi disimpan menggunakan dua cookie HTTP-Only: `access_token` dan `refresh_token`.
        Oleh karena itu, endpoint ini *tidak* mengembalikan token di dalam JSON body.

        **Self-healing:** Jika ada ketidakcocokan email antara database lokal dan sistem auth (misal user ganti email namun webhook gagal), sinkronisasi data akan otomatis terjadi di endpoint ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK (Login berhasil)
          headers:
            Set-Cookie:
              description: Mengembalikan dua cookie `access_token` dan `refresh_token` dengan konfigurasi `httpOnly`, `Secure`, dan `SameSite=None`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request (Format email salah / field kosong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (Email atau password salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Incorrect email or password"
        "403":
          description: Forbidden (Email belum diverifikasi atau akun disuspend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotVerified:
                  value:
                    errors: "Email not verified"
                Suspended:
                  value:
                    errors: "Account suspended. Please contact support."
        "409":
          description: Conflict (Email digunakan oleh profil database lain / anomali langka)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "This email address is already in use by another user. Please contact the admin"
        "500":
          description: Internal Server Error (Kendala pada sistem autentikasi upstream)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/logout:
    delete:
      tags:
        - Authentication
      summary: Logout
      description: |
        Menghapus sesi pengguna saat ini. 
        Endpoint ini menghapus cookie `access_token` dan `refresh_token` dari browser.

        **Catatan:** Endpoint ini didesain agar selalu mengembalikan respons `200 OK` tanpa memedulikan apakah token sudah *expired* atau invalid di *server side*. Hal ini untuk memastikan *cookie* di browser pengguna tetap dibersihkan.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK (Logout selalu berhasil)
          headers:
            Set-Cookie:
              description: Menghapus cookie `access_token` dan `refresh_token`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    example: "OK"
                  message:
                    type: string
                    example: "Logout successful"

  /api/users/me:
    get:
      tags:
        - User Profile
      summary: Get Current User
      description: |
        Ambil data profil user yang sedang login.
        Jika `access_token` sudah *expired* namun `refresh_token` masih valid, sesi akan diperpanjang secara otomatis (*silent refresh*) dan cookie baru akan diset di *response headers*.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized (Token tidak valid / expired atau mismatch dengan database lokal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                SessionExpired:
                  value:
                    errors: "Session Expired. Please login again."
                Mismatch:
                  value:
                    errors: "User database mismatch"

    patch:
      tags:
        - User Profile
      summary: Update User Profile
      description: |
        Mengubah profil akun (Saat ini hanya untuk field `name`).

        **Catatan (Frontend):**
        - Jangan gunakan endpoint ini untuk ganti Email / Password.
        - Penggantian Email/Password harus dilakukan menggunakan SDK Supabase langsung di sisi client. Sinkronisasi perubahan Email ke sistem database backend akan berjalan otomatis melalui *webhook* di belakang layar.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nama tampilan user
                  example: "Nama Baru"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Nama Baru"
        "400":
          description: Bad Request (Validasi field nama)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found (User tidak ditemukan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "User not found"
        "500":
          description: Internal Server Error (Gagal update)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Failed to update user profile"

    delete:
      tags:
        - User Profile
      summary: Delete Account
      description: |
        **PERINGATAN: PENGHAPUSAN PERMANEN (HARD DELETE).**
        Menghapus akun pengguna dari database (berbeda dari menghapus toko yang menggunakan mekanisme *soft-delete*).

        Sistem akan menolak penghapusan (409) jika toko milik pengguna masih memiliki antrean aktif (`BELUM_BAYAR` / `DIPROSES`).

        Saat berhasil, akun di Supabase Auth dan database lokal akan terhapus, lalu cookie auth akan dibersihkan (otomatis ter-logout).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK (Berhasil menghapus akun)
          headers:
            Set-Cookie:
              description: Menghapus cookie otentikasi.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    example: "OK"
                  message:
                    type: string
                    example: "Account permanently deleted"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (Penghapusan ditolak karena kondisi tertentu, misal ada transaksi aktif)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ActiveQueues:
                  value:
                    errors: "You cannot delete your account because your store still has active customer queues."
                RelationalData:
                  value:
                    errors: "We cannot delete the account because there is still data associated with it"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Cookie based authentication (`access_token` dan `refresh_token`)

  schemas:
    RegisterInput:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 100
          example: "rahasia123"
        name:
          type: string
          maxLength: 100
          example: "Nama User"

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "rahasia123"

    UserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            email:
              type: string
              example: "user@example.com"
            name:
              type: string
              example: "Nama User"

    ErrorResponse:
      type: object
      properties:
        errors:
          type: string
          example: "Pesan error dari server"
