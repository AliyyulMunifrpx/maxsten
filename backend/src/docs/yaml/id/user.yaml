openapi: 3.0.0
info:
  title: Maxsten API - Authentication & User Profile
  version: 1.0.0
  description: |
    Dokumentasi API untuk sistem POS & Mini-ERP Maxsten.
    Mencakup alur registrasi, autentikasi (login/logout), dan manajemen profil user.
servers:
  - url: https://api.maxsten.com
    description: Production Server
  - url: http://localhost:3000
    description: Local Development

security:
  - bearerAuth: []
  - refreshToken: [] # TAMBAHAN: Konsistensi dengan dokumen lain

paths:
  /api/users:
    post:
      tags:
        - Authentication
      summary: Register User
      security: [] # Public endpoint
      description: |
        Mendaftarkan akun user baru.

        **Catatan Khusus (Frontend):**
        - Setelah mendapat respons sukses (201), jangan langsung arahkan user ke Dashboard. Tampilkan pesan "Cek email Anda untuk konfirmasi".
        - User **wajib** melakukan konfirmasi melalui link di email sebelum bisa login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created (Berhasil mendaftar, menunggu konfirmasi email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request (Email duplikat atau format salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/login:
    post:
      tags:
        - Authentication
      summary: Login User
      security: [] # Public endpoint
      description: |
        Proses autentikasi user. 

        **Catatan Khusus:**
        - Jika data user sudah ada di sistem Auth (Supabase) tapi belum ada di database lokal (Prisma), sistem akan otomatis membuatkannya dengan nama default "User".
        - **Manajemen Token (Bearer API):** Endpoint ini mengembalikan `access_token` & `refresh_token` MURNI di dalam JSON Body. 
        - Frontend **WAJIB** menyimpan token ini (misalnya di LocalStorage atau State Management) dan menyertakannya di header `Authorization: Bearer <token>` pada setiap request API yang membutuhkan autentikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK (Login berhasil)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unauthorized (Email atau password salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (Email belum diverifikasi atau akun diblokir)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/logout:
    delete:
      tags:
        - Authentication
      summary: Logout User
      description: |
        Menghapus sesi user dari sistem backend.

        **Catatan Khusus (Frontend):**
        - **PENTING:** Frontend **wajib** menghapus token dari memori lokal (LocalStorage/State) saat menerima respons sukses dari endpoint ini, agar UI kembali ke halaman Login.
      responses:
        "200":
          description: OK (Logout berhasil)
          # TAMBAHAN: Jika middleware trigger refresh token pas mau logout
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error

  /api/users/me:
    get:
      tags:
        - User Profile
      summary: Get Current User Profile
      description: Mengambil data profil user yang sedang login.
      responses:
        "200":
          description: OK
          # TAMBAHAN: Auto-refresh headers
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized (Token tidak valid / expired / gagal refresh)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - User Profile
      summary: Update User Name
      description: Mengubah nama profil user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Nama Baru"
      responses:
        "200":
          description: OK
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Nama Baru"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found (User tidak ditemukan)

    delete:
      tags:
        - User Profile
      summary: Delete Account (Permanently)
      description: |
        Menghapus akun user secara **permanen** dari sistem (termasuk Supabase Auth).
        Toko (*Store*) milik user akan di-*soft delete*, dan Logo toko di *cloud storage* akan dihapus.

        **Catatan Validasi:**
        - Akun **TIDAK BISA DIHAPUS** jika toko masih memiliki antrean aktif (status `BELUM_BAYAR` atau `DIPROSES`).
        - Jika berhasil dihapus, Frontend wajib membersihkan token dari penyimpanan lokal (Otomatis Logout).
      responses:
        "200":
          description: OK (Akun berhasil dihapus)
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (Ada antrean aktif atau masalah relasi data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/email:
    patch:
      tags:
        - User Profile
      summary: Update User Email
      description: Mengubah alamat email user. Akan ditolak jika email baru sudah terdaftar di sistem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "emailbaru@domain.com"
      responses:
        "200":
          description: OK
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
        "400":
          description: Bad Request (Email kosong)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (Email sudah digunakan user lain)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan access token di header Authorization (Bearer {token})
    
    # TAMBAHAN: Jangan lupakan ini agar input x-refresh-token muncul di Swagger UI
    refreshToken:
      type: apiKey
      in: header
      name: x-refresh-token
      description: "Masukkan refresh token di sini untuk mekanisme auto-refresh (tanpa cookie)."

  schemas:
    RegisterInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "Aliyyul Gemini"
        email:
          type: string
          format: email
          example: "aliyyulgemini@gmail.com"
        password:
          type: string
          minLength: 8
          example: "rahasia123"

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "aliyyulgemini@gmail.com"
        password:
          type: string
          example: "rahasia123"

    UserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            email:
              type: string
              example: "aliyyulgemini@gmail.com"
            name:
              type: string
              example: "Aliyyul Gemini"

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            email:
              type: string
              example: "aliyyulgemini@gmail.com"
            name:
              type: string
              example: "Aliyyul Gemini"
            access_token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            refresh_token:
              type: string
              example: "abc123xyz..."

    SuccessResponse:
      type: object
      properties:
        data:
          type: string
          example: "OK"
        message:
          type: string
          example: "Operation successful"

    ErrorResponse:
      type: object
      properties:
        errors:
          type: string
          example: "Pesan error spesifik akan muncul di sini"
