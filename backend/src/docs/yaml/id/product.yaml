openapi: 3.0.0

info:
  title: Maxsten API - Product Management
  version: 1.0.0
  description: Dokumentasi API untuk mengelola katalog produk, varian, ketersediaan, dan gambar produk.

servers:
  - url: https://api.maxsten.com
    description: Production Server

# DISAMAKAN: Menambahkan refreshToken sebagai fallback, konsisten dengan file lain.
# Setiap operation di bawah sekarang punya security block sendiri supaya
# nggak gantung ke inheritance root.
security:
  - bearerAuth: []
  - refreshToken: []

paths:
  /api/stores/me/{publicId}/products:
    get:
      tags:
        - Product
      summary: Get All Products (With Prefetch)
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: |
        Mengambil daftar seluruh produk milik toko. Akses ini menggunakan `publicId` toko.

        **Catatan Khusus (Frontend):**

        - **Prefetch Pagination:** Mengembalikan `currentPage` dan `nextPage` sekaligus. Saat di halaman 1, data halaman 2 sudah tersedia di `nextPage`. Panggil API untuk halaman 2 secara *background* hanya ketika *user* mulai melihat halaman 2.
        - **Metrik total_sold:** Terdapat field `total_sold` di setiap produk yang dihitung *real-time* dari total pesanan berstatus `SELESAI`. Bisa digunakan untuk menampilkan label "Terjual: 150".

      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string

        - name: page
          in: query
          schema:
            type: integer
            default: 1

      responses:
        "200":
          description: OK
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

        "404":
          description: Not Found

  /api/stores/products:
    post:
      tags:
        - Product
      summary: Create New Product
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: |
        Menambahkan produk baru beserta gambar, varian, dan add-on.

        **Business Logic (PENTING BUAT FRONTEND):**

        - **Multipart/Form-Data:** Wajib menggunakan format ini karena ada upload gambar (`image`).
        - **Parsing Array:** Karena menggunakan form-data, field array seperti `variants` dan `addon_group_ids` wajib diubah menjadi JSON string (`JSON.stringify()`) sebelum dikirim. Backend akan melakukan `JSON.parse()` secara otomatis.

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateProductInput"

      responses:
        "201":
          description: Created
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string

        "400":
          description: Bad Request (Format data salah atau add-on group tidak valid)

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

        "409":
          description: Conflict (Nama produk atau nama varian sudah ada)

  /api/stores/products/{productId}:
    get:
      tags:
        - Product
      summary: Get Product Detail
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: Mengambil detail lengkap satu produk beserta varian, add-on, dan akumulasi `total_sold`.

      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: OK
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProductItem"

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

        "404":
          description: Not Found

    patch:
      tags:
        - Product
      summary: Update Product Information
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: |
        Mengubah data produk tanpa gambar.

        **Business Logic (FITUR FREEZE):**

        - Jika produk ini sedang berada dalam **antrean aktif** (`BELUM_BAYAR` / `DIPROSES`), maka `price`, `variants`, dan `addon_group_ids` **TIDAK BISA DIUBAH** dan akan mengembalikan `400 Bad Request`.
        - Dalam kondisi antrean aktif, hanya `name` dan `description` yang diizinkan untuk diubah.
        - Terdapat *Pessimistic Locking* di sisi *backend* untuk mencegah bentrok data antar kasir.

      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"

      responses:
        "200":
          description: OK
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string

        "400":
          description: Bad Request (Ditolak karena ada pesanan aktif)

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

        "409":
          description: Conflict (Nama sudah dipakai atau terjadi bentrok update)

    delete:
      tags:
        - Product
      summary: Delete Product (Soft Delete)
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: |
        Menghapus produk dan seluruh variannya secara *soft delete* (`is_delete: true`).

        File gambar di Supabase Storage akan dihapus secara permanen.

        **Business Logic (BLOCK DELETE):**

        Produk **TIDAK BISA DIHAPUS** jika masih terdapat antrean aktif (`BELUM_BAYAR` / `DIPROSES`) yang memesan produk ini. Frontend harus menampilkan peringatan kepada user.

      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: OK
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string

        "400":
          description: Bad Request (Gagal dihapus karena ada antrean aktif)

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

  /api/stores/products/{productId}/image:
    patch:
      tags:
        - Product
      summary: Update Product Image
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: Mengunggah dan mengganti gambar produk. Gambar lama di Supabase Storage akan otomatis dihapus.

      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: File gambar produk

      responses:
        "200":
          description: OK
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

  /api/stores/products/{productId}/availability:
    patch:
      tags:
        - Product
      summary: Toggle Product Availability
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: Menonaktifkan atau mengaktifkan ketersediaan produk (Habis/Tersedia). Sangat berguna bagi kasir untuk mematikan produk dengan cepat (Toggle).

      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_available
              properties:
                is_available:
                  type: boolean
                  example: false

      responses:
        "200":
          description: OK
          # DITAMBAHKAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string

        # DITAMBAHKAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    # DITAMBAHKAN: Definisi refreshToken, konsisten dengan file lain
    refreshToken:
      type: apiKey
      in: header
      name: x-refresh-token
      description: "Masukkan refresh token di sini untuk mekanisme auto-refresh (tanpa cookie)."

  schemas:
    ProductListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            currentPage:
              type: array
              items:
                $ref: "#/components/schemas/ProductItem"

            nextPage:
              type: array
              items:
                $ref: "#/components/schemas/ProductItem"

            pagination:
              type: object
              properties:
                currentPage:
                  type: integer

                limit:
                  type: integer
                  example: 20

                totalRows:
                  type: integer

                totalPages:
                  type: integer

    ProductItem:
      type: object
      properties:
        id:
          type: string

        name:
          type: string

        description:
          type: string

        price:
          type: integer

        image_url:
          type: string

        is_available:
          type: boolean

        total_sold:
          type: integer
          description: Total akumulasi penjualan dari antrean SELESAI

        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string

              name:
                type: string

              additional_price:
                type: integer

        productAddonGroups:
          type: array
          items:
            type: object
            properties:
              addon_group:
                type: object
                properties:
                  id:
                    type: string

                  name:
                    type: string

                  addons:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string

                        name:
                          type: string

                        price:
                          type: integer

    CreateProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string

        description:
          type: string

        price:
          type: integer

        image:
          type: string
          format: binary
          description: File gambar produk

        variants:
          type: string
          description: 'Array of objects (di-stringify). Format: [{"name": "Besar", "additional_price": 5000}]'

        addon_group_ids:
          type: string
          description: 'Array of strings (di-stringify). Format: ["uuid-addon-1", "uuid-addon-2"]'

    UpdateProductInput:
      type: object
      properties:
        name:
          type: string

        description:
          type: string

        price:
          type: integer

        variants:
          type: array
          description: Harus menggunakan JSON array (bukan stringified karena ini `application/json`)
          items:
            type: object
            properties:
              id:
                type: string
                description: Isi jika mengupdate varian lama. Kosongkan jika varian baru.

              name:
                type: string

              additional_price:
                type: integer

        addon_group_ids:
          type: array
          items:
            type: string
