openapi: 3.0.3
info:
  title: Postal Code Lookup API
  description: Proxy pencarian kode pos ke layanan pihak ketiga (carikodepos.id) untuk fitur auto-fill alamat toko.
  version: 1.0.0
servers:
  - url: https://example.com
    description: Production Server
tags:
  - name: Postal Codes
    description: Layanan eksternal / proxy untuk mencari data wilayah berdasarkan kode pos
paths:
  /api/stores/postal-codes:
    get:
      tags:
        - Postal Codes
      summary: Postal Code Lookup
      description: |
        Proxy pencarian kode pos ke layanan pihak ketiga (carikodepos.id) — dipakai untuk fitur auto-fill alamat (provinsi/kota/kecamatan/desa) di form buat/edit toko.

        **Catatan:**
        - **Murni Proxy:** Tidak ada *caching*, *rate limiting*, atau transformasi *response* di sisi *backend*.
        - **Ketergantungan Eksternal:** Fitur ini 100% bergantung pada *uptime* `carikodepos.id`. Jika layanan mereka *down*, maka endpoint ini akan mengembalikan kode status 500.
        - **Validasi Absen:** Saat ini belum ada validasi format Joi. Jika param `postalCode` tidak dikirim, request tetap diteruskan sebagai `q=undefined` ke pihak ketiga.
      security:
        - cookieAuth: []
      parameters:
        - name: postalCode
          in: query
          required: false
          description: Kode pos yang dicari (bisa pencarian parsial). Secara logis ini dibutuhkan, namun belum ada validasi di API.
          schema:
            type: string
            example: "56151"
      responses:
        "200":
          description: OK (Meneruskan respon dari pihak ketiga, maksimal 5 hasil)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostalCodeResponse"
        "401":
          description: Unauthorized (Tidak login / session expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Unauthorized"
        "500":
          description: Internal Server Error (API pihak ketiga error atau koneksi timeout)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ThirdPartyError:
                  value:
                    errors: "Failed to retrieve the ZIP code data"
                GenericError:
                  value:
                    errors: "Internal Server Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Cookie based authentication (membutuhkan `access_token` dan `refresh_token`).

  schemas:
    LocationDetail:
      type: object
      properties:
        id:
          type: string
          description: ID wilayah dari pihak ketiga
          example: "3308022003"
        name:
          type: string
          description: Nama wilayah
          example: "TONOBOYO"

    PostalCodeData:
      type: object
      properties:
        province:
          $ref: "#/components/schemas/LocationDetail"
        city:
          $ref: "#/components/schemas/LocationDetail"
        district:
          $ref: "#/components/schemas/LocationDetail"
        village:
          $ref: "#/components/schemas/LocationDetail"

    PostalCodeResponse:
      type: object
      properties:
        data:
          type: array
          description: Daftar hasil wilayah berdasarkan kode pos, diteruskan apa adanya dari carikodepos.id (maksimal 5 item).
          items:
            $ref: "#/components/schemas/PostalCodeData"
          example:
            - province:
                id: "33"
                name: "JAWA TENGAH"
              city:
                id: "3308"
                name: "KAB. MAGELANG"
              district:
                id: "330802"
                name: "BANDONGAN"
              village:
                id: "3308022003"
                name: "TONOBOYO"

    ErrorResponse:
      type: object
      properties:
        errors:
          type: string
          example: "Pesan error dari server"
