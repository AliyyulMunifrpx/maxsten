openapi: 3.0.0
info:
  title: Maxsten API - Addon Management
  version: 1.0.0
  description: Dokumentasi API untuk mengelola Grup Add-on (opsi tambahan) dan item di dalamnya (contoh: Ekstra Topping, Pilihan Susu, dll).
servers:
  - url: https://api.maxsten.com
    description: Production Server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/stores/addon-groups:
    get:
      tags:
        - Store / Addon
      summary: Get All Addon Groups
      description: |
        Mengambil seluruh daftar Grup Add-on beserta item add-on di dalamnya yang masih aktif.
        
        **Catatan Pengurutan:**
        - Data diurutkan berdasarkan `created_at` secara ASCENDING (Terdahulu ke Terbaru) baik untuk grup maupun item add-on di dalamnya.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddonGroupListResponse"
        "404":
          description: Not Found (Toko tidak ditemukan)

    post:
      tags:
        - Store / Addon
      summary: Create Addon Group
      description: |
        Membuat grup add-on baru beserta item-item di dalamnya.
        
        **Business Logic & Sanitasi:**
        - **Auto-Format:** Backend secara otomatis melakukan `trim()` dan `toLowerCase()` pada nama grup dan nama item add-on. Frontend disarankan mengatur kapitalisasi secara visual via CSS (misal `text-transform: capitalize`).
        - **Anti-Duplikat Lapis 2:** Akan menolak (409) jika nama grup sudah ada, dan menolak (400) jika terdapat nama item add-on yang kembar di dalam *payload* yang sama.
        - **JSON Fallback:** Walaupun endpoint ini menerima `application/json`, jika *field* `addons` terkirim sebagai *stringified JSON*, backend akan secara otomatis melakukan *parsing*.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddonGroupInput"
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request (Format salah atau ada duplikasi nama item)
        "409":
          description: Conflict (Nama grup add-on sudah ada di toko ini)

  /api/stores/addon-groups/{addonGroupId}:
    get:
      tags:
        - Store / Addon
      summary: Get Single Addon Group
      description: Mengambil detail satu grup add-on beserta item-itemnya.
      parameters:
        - name: addonGroupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AddonGroupItem"
        "404":
          description: Not Found

    patch:
      tags:
        - Store / Addon
      summary: Edit Addon Group
      description: |
        Memperbarui data grup dan item add-on (tambah baru, edit yang ada, atau hapus item lama).
        
        **Business Logic (PENTING):**
        - **BLOCK EDIT (FREEZE):** Endpoint ini akan mengembalikan status `409 Conflict` jika grup add-on ini terpasang pada produk yang saat ini **berada dalam antrean aktif** (`BELUM_BAYAR` atau `DIPROSES`). Frontend wajib mendesain UI untuk menangani *error* ini (contoh: me-*disable* tombol edit).
        - **Soft-Delete Otomatis:** Item add-on lama yang ID-nya **TIDAK** disertakan dalam *payload* array `addons` akan dianggap dihapus secara otomatis (*soft delete*).
        - **Pencegahan Tabrakan Nama:** Backend mengecek jika nama add-on baru yang dimasukkan ternyata sama dengan nama add-on yang barusan di-*soft-delete*.
      parameters:
        - name: addonGroupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditAddonGroupInput"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request (ID item tidak valid atau tabrakan nama)
        "409":
          description: Conflict (Grup ini sedang terkunci karena pesanan aktif, atau nama grup duplikat)

    delete:
      tags:
        - Store / Addon
      summary: Delete Addon Group
      description: |
        Menghapus grup add-on beserta seluruh isinya secara *Soft Delete*.
        
        **Business Logic:**
        - **BLOCK DELETE:** Sama seperti fitur Edit, grup **TIDAK BISA DIHAPUS** jika sedang terpasang pada produk di antrean aktif. Akan mengembalikan `409 Conflict`.
      parameters:
        - name: addonGroupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "409":
          description: Conflict (Grup terkunci karena pesanan aktif)

components:
  schemas:
    AddonGroupListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AddonGroupItem"

    AddonGroupItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "pilihan susu"
        created_at:
          type: string
          format: date-time
        addons:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                example: "oat milk"
              price:
                type: integer
                example: 5000
              created_at:
                type: string
                format: date-time

    CreateAddonGroupInput:
      type: object
      required:
        - name
        - addons
      properties:
        name:
          type: string
          example: "Pilihan Susu"
        addons:
          type: array
          description: Bisa dikirim sebagai JSON Array murni, atau JSON Stringified jika melalui FormData.
          items:
            type: object
            required:
              - name
              - price
            properties:
              name:
                type: string
                example: "Oat Milk"
              price:
                type: integer
                example: 5000

    EditAddonGroupInput:
      type: object
      required:
        - name
        - addons
      properties:
        name:
          type: string
          example: "Pilihan Susu (Update)"
        addons:
          type: array
          items:
            type: object
            required:
              - name
              - price
            properties:
              id:
                type: string
                description: Kirim ID jika ini adalah item lama yang mau diubah/dipertahankan. JANGAN kirim ID jika ini adalah item baru. Item lama yang ID-nya tidak dikirim di sini akan otomatis terhapus (Soft Delete).
              name:
                type: string
                example: "Almond Milk"
              price:
                type: integer
                example: 7000