openapi: 3.0.0

info:
  title: Maxsten API - Addon Management
  version: 1.0.0
  description: Dokumentasi API untuk mengelola grup add-on dan item di dalamnya, seperti ekstra topping, pilihan susu, dan opsi tambahan lainnya.

servers:
  - url: https://api.maxsten.com
    description: Production Server

security:
  - bearerAuth: []

paths:
  /api/stores/addon-groups:
    get:
      tags:
        - Store / Addon
      summary: Get All Addon Groups
      description: |
        Mengambil seluruh daftar grup add-on beserta item add-on di dalamnya yang masih aktif.

        Catatan pengurutan:
        - Data diurutkan berdasarkan `created_at` secara ascending (terdahulu ke terbaru).
        - Pengurutan tersebut berlaku untuk grup maupun item add-on di dalamnya.

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddonGroupListResponse"

        "404":
          description: Not Found (Toko tidak ditemukan)

    post:
      tags:
        - Store / Addon
      summary: Create Addon Group
      description: |
        Membuat grup add-on baru beserta item-item di dalamnya.

        Business Logic & Sanitasi:
        - Auto-Format: Backend secara otomatis melakukan `trim()` dan `toLowerCase()` pada nama grup dan nama item add-on.
        - Frontend dapat mengatur kapitalisasi secara visual menggunakan CSS, misalnya `text-transform: capitalize`.
        - Anti-Duplikat: Akan menolak dengan status `409` jika nama grup sudah ada.
        - Backend akan menolak dengan status `400` jika terdapat nama item add-on yang duplikat dalam payload yang sama.
        - JSON Fallback: Jika field `addons` dikirim sebagai stringified JSON, backend akan melakukan parsing secara otomatis.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddonGroupInput"

      responses:
        "201":
          description: Created

        "400":
          description: Bad Request (Format salah atau terdapat duplikasi nama item)

        "409":
          description: Conflict (Nama grup add-on sudah ada di toko ini)

  /api/stores/addon-groups/{addonGroupId}:
    get:
      tags:
        - Store / Addon
      summary: Get Single Addon Group
      description: Mengambil detail satu grup add-on beserta seluruh item add-on di dalamnya.

      parameters:
        - name: addonGroupId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AddonGroupItem"

        "404":
          description: Not Found

    patch:
      tags:
        - Store / Addon
      summary: Edit Addon Group
      description: |
        Memperbarui data grup dan item add-on, termasuk menambah item baru, mengubah item yang sudah ada, atau menghapus item lama.

        Business Logic:
        - BLOCK EDIT: Endpoint mengembalikan status `409 Conflict` jika grup add-on sedang terpasang pada produk yang berada dalam antrean aktif (`BELUM_BAYAR` atau `DIPROSES`).
        - Soft Delete Otomatis: Item add-on lama yang ID-nya tidak disertakan dalam payload `addons` akan dianggap dihapus secara otomatis.
        - Pencegahan Tabrakan Nama: Backend mengecek apakah nama add-on baru bertabrakan dengan nama add-on yang baru saja di-soft-delete.

      parameters:
        - name: addonGroupId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditAddonGroupInput"

      responses:
        "200":
          description: OK

        "400":
          description: Bad Request (ID item tidak valid atau terjadi tabrakan nama)

        "409":
          description: Conflict (Grup sedang terkunci karena pesanan aktif atau nama grup duplikat)

    delete:
      tags:
        - Store / Addon
      summary: Delete Addon Group
      description: |
        Menghapus grup add-on beserta seluruh isinya secara soft delete.

        Business Logic:
        - BLOCK DELETE: Grup tidak dapat dihapus jika sedang terpasang pada produk yang memiliki antrean aktif.
        - Antrean aktif terdiri dari status `BELUM_BAYAR` dan `DIPROSES`.
        - Jika grup terkunci, endpoint mengembalikan `409 Conflict`.

      parameters:
        - name: addonGroupId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: OK

        "409":
          description: Conflict (Grup terkunci karena pesanan aktif)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AddonGroupListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AddonGroupItem"

    AddonGroupItem:
      type: object
      properties:
        id:
          type: string

        name:
          type: string
          example: "pilihan susu"

        created_at:
          type: string
          format: date-time

        addons:
          type: array
          items:
            type: object
            properties:
              id:
                type: string

              name:
                type: string
                example: "oat milk"

              price:
                type: integer
                example: 5000

              created_at:
                type: string
                format: date-time

    CreateAddonGroupInput:
      type: object
      required:
        - name
        - addons
      properties:
        name:
          type: string
          example: "Pilihan Susu"

        addons:
          type: array
          description: Dapat dikirim sebagai JSON Array atau JSON Stringified jika dikirim melalui FormData.
          items:
            type: object
            required:
              - name
              - price
            properties:
              name:
                type: string
                example: "Oat Milk"

              price:
                type: integer
                example: 5000

    EditAddonGroupInput:
      type: object
      required:
        - name
        - addons
      properties:
        name:
          type: string
          example: "Pilihan Susu (Update)"

        addons:
          type: array
          items:
            type: object
            required:
              - name
              - price
            properties:
              id:
                type: string
                description: Kirim ID jika item merupakan item lama yang ingin diubah atau dipertahankan. Jangan kirim ID untuk item baru. Item lama yang ID-nya tidak dikirim akan otomatis di-soft-delete.

              name:
                type: string
                example: "Almond Milk"

              price:
                type: integer
                example: 7000
