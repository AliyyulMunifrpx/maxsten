openapi: 3.0.0
info:
  title: Maxsten API - Store Management
  version: 1.0.0
  description: Dokumentasi API untuk manajemen Toko (Store), jam operasional, dan analitik pendapatan.
servers:
  - url: https://api.maxsten.com
    description: Production Server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/stores:
    post:
      tags:
        - Store
      summary: Create New Store
      description: |
        Membuat toko baru. Satu akun hanya bisa memiliki satu toko (1:1 relation).

        **Catatan Khusus (Operational Hours):**
        - Format hari menggunakan angka `0` (Minggu) sampai `6` (Sabtu).
        - Jika `operational_hours` dikosongkan saat *create*, sistem otomatis membuat jadwal *default* buka setiap hari dari jam `08:00` hingga `20:00`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateStoreInput"
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request (User sudah punya toko / format jam operasional salah)

  /api/stores/me:
    get:
      tags:
        - Store
      summary: Get My Store
      description: |
        Mengambil detail toko milik user yang sedang login beserta status `is_open` (buka/tutup) saat ini secara real-time.

        **Catatan Khusus (Payment Timeout):**
        - Endpoint ini mengembalikan `payment_timeout` yang mengatur batas waktu pembayaran pembeli (dalam menit).
        - Frontend harus mengambil nilai ini untuk mengatur komponen Countdown Timer di UI pelanggan.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDetailResponse"
        "404":
          description: Not Found

    patch:
      tags:
        - Store
      summary: Update Store Profile
      description: |
        Mengubah data profil toko (nama, alamat, timezone, dll). Tidak termasuk logo.

        **Catatan Khusus (Payment Timeout):**
        - Saat toko pertama kali dibuat, sistem otomatis memberikan nilai default `payment_timeout` sebesar **30 menit**.
        - Nilai tersebut HANYA bisa diubah melalui endpoint ini.
        - Field ini sangat krusial karena menjadi acuan Cron Job di backend untuk membatalkan pesanan (status `BELUM_BAYAR`) secara otomatis jika waktu habis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreInput"
      responses:
        "200":
          description: OK

    delete:
      tags:
        - Store
      summary: Delete Store
      description: |
        Menghapus toko (Soft Delete).

        **Catatan Keamanan:**
        - Toko **TIDAK BISA DIHAPUS** jika masih ada antrean aktif (`BELUM_BAYAR` atau `DIPROSES`).
        - Logo toko di penyimpanan Cloud (Supabase Storage) akan dihapus permanen untuk menghemat ruang.
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request (Masih ada antrean aktif)

  /api/stores/me/logo:
    patch:
      tags:
        - Store
      summary: Update Store Logo
      description: Mengunggah dan mengganti logo toko. Logo lama di Cloud Storage akan otomatis dihapus.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK

  /api/stores/{storeId}/status:
    patch:
      tags:
        - Store
      summary: Manual Open/Close Store (Override)
      description: |
        Digunakan untuk mengubah status toko secara manual (misal: ada keperluan mendadak untuk tutup, atau buka lebih awal).

        **Catatan Khusus (Override Logic):**
        - Status manual ini **hanya berlaku pada hari tersebut**. 
        - Ketika jam menyentuh `00:00` (berganti hari di zona waktu toko), status manual akan otomatis diabaikan, dan toko akan kembali mengikuti jadwal reguler (`operational_hours`).
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            description: Public ID dari toko
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manual_status:
                  type: string
                  enum: [OPEN, CLOSED]
      responses:
        "200":
          description: OK

  /api/stores/me/history:
    get:
      tags:
        - Store Analytics
      summary: Get Store Analytics & History
      description: |
        Mengambil data analitik toko, grafik pendapatan, dan riwayat pesanan.

        **Catatan Apple-to-Apple Comparison:**
        - Perhitungan tren bulan ini vs bulan lalu sangat akurat. 
        - Jika hari ini tanggal 5 Mei, maka data akan dibandingkan secara *apple-to-apple* dengan performa tanggal 1-5 April, bukan sebulan penuh.
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, SELESAI, DIBATALKAN]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Halaman untuk tabel Riwayat Antrean
        - name: topPage
          in: query
          schema:
            type: integer
            default: 1
          description: Halaman untuk ranking Top Selling Products
        - name: topLimit
          in: query
          schema:
            type: integer
            default: 10
          description: Batas data per halaman untuk Top Selling
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"

  /api/stores/me/operational-hours:
    patch:
      tags:
        - Store
      summary: Update Operational Hours
      description: Mengubah jadwal buka/tutup toko reguler.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operational_hours:
                  type: array
                  items:
                    $ref: "#/components/schemas/OperationalHourItem"
      responses:
        "200":
          description: OK

  /api/stores/postal-codes:
    get:
      tags:
        - Store
      summary: Search Postal Code (Autofill Address)
      description: |
        Mencari data kodepos (Bypass ke API pihak ketiga `carikodepos.id`).

        **Konteks UX (Autofill):**
        - Digunakan untuk fitur **Otomatisasi Pengisian Alamat** saat user membuat atau mengedit profil toko.
        - Saat user memasukkan kodepos, Frontend menembak endpoint ini dan menggunakan data responsenya untuk otomatis mengisi *field* `province`, `city` (Kabupaten/Kota), `district` (Kecamatan), dan `village` (Kelurahan/Desa) tanpa perlu user mengetik manual.
      parameters:
        - name: postalCode
          in: query
          required: true
          schema:
            type: string
            example: "56151"
      responses:
        "200":
          description: OK (Berhasil mengambil data kodepos)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    description: Array berisi daftar wilayah yang menggunakan kodepos tersebut
                    items:
                      type: object
                      properties:
                        postalCode:
                          type: string
                          example: "56151"
                        district:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "Bandongan"
                        city:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "KAB. MAGELANG"
                        province:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "JAWA TENGAH"
                        village:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "Sukosari"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 5
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 5
                      totalPages:
                        type: integer
                        example: 1

components:
  schemas:
    CreateStoreInput:
      type: object
      required:
        - name
        - timezone
      properties:
        name:
          type: string
        description:
          type: string
        street_address:
          type: string
        city:
          type: string
        province:
          type: string
        timezone:
          type: string
          example: "Asia/Jakarta"
        logo:
          type: string
          format: binary
          description: File gambar logo toko
        operational_hours:
          type: string
          description: JSON Stringified dari array jadwal operasional (Opsional)

    UpdateStoreInput:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        payment_timeout:
          type: integer
          description: Batas waktu tunggu pembayaran (dalam menit)

    OperationalHourItem:
      type: object
      properties:
        day:
          type: integer
          description: 0 (Minggu) - 6 (Sabtu)
        open_time:
          type: string
          example: "08:00"
        close_time:
          type: string
          example: "20:00"
        is_active:
          type: boolean
          example: true

    StoreDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            public_id:
              type: string
            name:
              type: string
            is_open:
              type: boolean
              description: Dihitung secara real-time dari jadwal atau override manual
            timezone:
              type: string
            payment_timeout:
              type: integer
              description: Batas waktu tunggu pembayaran (dalam menit). Default 30.
            operational_hours:
              type: array
              items:
                $ref: "#/components/schemas/OperationalHourItem"

    HistoryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            summary:
              type: object
              properties:
                totalOmzet:
                  type: integer
                totalPesanan:
                  type: integer
                trend:
                  type: object
                  description: Persentase perbandingan dengan periode bulan lalu
            charts:
              type: object
              description: Data array siap pakai untuk Chart.js / Recharts
            history:
              type: array
              description: Daftar antrean (pagination)
