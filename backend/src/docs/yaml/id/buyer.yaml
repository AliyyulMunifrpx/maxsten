openapi: 3.0.0
info:
  title: Maxsten API - Buyer & Queue (Public)
  version: 1.0.0
  description: Dokumentasi API publik untuk interaksi pembeli dengan toko (melihat katalog, membuat antrean, dan melacak pesanan). Tanpa perlu login/register.
servers:
  - url: https://api.maxsten.com
    description: Production Server

paths:
  /api/stores/{storeId}/products:
    get:
      tags:
        - Buyer / Store
      summary: Get Store Catalog (Products)
      description: |
        Menampilkan seluruh katalog produk milik toko (yang aktif/is_available).

        **Business Logic:**
        - **Fuzzy Search:** Jika parameter `keyword` diisi, pencarian akan mentoleransi salah ketik (typo). Contoh: "kpi" tetap memunculkan "kopi".
        - Menggunakan *Prefetch Pagination* (mengembalikan `currentPage` dan `nextPage`).
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: keyword
          in: query
          schema:
            type: string
            description: Kata kunci pencarian nama produk
      responses:
        "200":
          description: OK

  /api/stores/{storeId}/products/{productId}:
    get:
      tags:
        - Buyer / Store
      summary: Get Product Details
      description: |
        Mengambil detail produk secara spesifik, termasuk daftar Varian dan Add-on yang tersedia.
        Sistem juga mengembalikan `total_sold` (akumulasi produk terjual).
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /api/stores/{storeId}/queues:
    post:
      tags:
        - Buyer / Queue
      summary: Create Order Queue
      description: |
        Membuat antrean pesanan baru.

        **Business Logic (PENTING BUAT FRONTEND):**
        - **Rate Limiter (Spam Protection):** Maksimal 2 kali pembuatan antrean dalam 10 menit untuk alamat IP yang sama. Jika lebih, akan melempar error `429 Too Many Requests`.
        - **Guest ID (Sesi Pembeli):** Frontend sangat disarankan mengirim `guest-id` di *Header*. Jika tidak ada, backend akan men-generate UUID baru dan mengembalikannya melalui Cookie browser pembeli.
        - **Satu Antrean Aktif:** Pembeli (dengan `guest-id` yang sama) **TIDAK BISA** membuat pesanan baru jika masih memiliki pesanan berstatus `BELUM_BAYAR` (belum *expired*) atau `DIPROSES`.
        - **Socket.io:** Sukses membuat antrean akan mentrigger emit event `"NEW_QUEUE"` ke room `TOKO_{storeId}`.
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
        - name: guest-id
          in: header
          required: false
          schema:
            type: string
            description: UUID identitas pengunjung (Opsional pada request pertama)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQueueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_now:
                        type: string
                        format: date-time
                        description: Waktu server. Gunakan selisih dengan `expired_at` untuk membuat UI hitung mundur (Countdown Timer).
        "400":
          description: Bad Request (Toko tutup, antrean masih ada, atau stok habis)
        "429":
          description: Too Many Requests (Rate limit terlampaui)

  /api/stores/{storeId}/queues/{queueId}:
    get:
      tags:
        - Buyer / Queue
      summary: Track Queue Status
      description: |
        Digunakan oleh pembeli untuk melacak status pesanan mereka secara real-time.

        **Otorisasi:**
        - Endpoint ini mewajibkan keberadaan `guest_id` di *Cookie* atau *Header*. Jika ID tidak cocok dengan pemilik antrean, akses ditolak (`401 Unauthorized`).
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
        - name: queueId
          in: path
          required: true
          schema:
            type: string
        - name: guest-id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized (Bukan pemilik pesanan)
        "404":
          description: Not Found

  /api/stores/{storeId}/queues/{queueId}/cancel:
    patch:
      tags:
        - Buyer / Queue
      summary: Cancel Queue (By Buyer)
      description: |
        Pembeli membatalkan pesanannya sendiri.

        **Business Logic:**
        - Hanya pesanan berstatus `BELUM_BAYAR` yang bisa dibatalkan oleh pembeli. Jika sudah `DIPROSES` (sudah dimasak), aksi akan ditolak.
        - **Hak Asasi Pembeli:** Pembeli tetap dapat membatalkan pesanan meskipun toko sudah dihapus/tutup (*soft delete*).
        - **Socket.io:** Sukses membatalkan akan menembak event `"STATUS_UPDATED"` (dengan property `triggered_by: "buyer"`) ke room `ANTREAN_{queueId}` dan `TOKO_{storeId}`.
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
        - name: queueId
          in: path
          required: true
          schema:
            type: string
        - name: guest-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Berubah pikiran"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request (Pesanan sudah diproses atau keduluan diambil kasir)

components:
  schemas:
    CreateQueueInput:
      type: object
      required:
        - items
      properties:
        note:
          type: string
          description: Catatan untuk dapur (Opsional)
        items:
          type: array
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
              variant_id:
                type: string
                description: UUID dari varian yang dipilih (Opsional)
              quantity:
                type: integer
                minimum: 1
              selected_addons:
                type: array
                description: Array of UUID dari add-on yang dipilih
                items:
                  type: string
