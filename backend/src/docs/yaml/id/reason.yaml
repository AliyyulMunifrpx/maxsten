openapi: 3.0.0
info:
  title: Maxsten API - Seller (Cancel Reasons)
  version: 1.0.0
  description: Dokumentasi API untuk mengelola template "Alasan Pembatalan" (Cancel Reasons) pesanan agar kasir tidak perlu mengetik ulang alasan yang sama berulang kali.
servers:
  - url: https://api.maxsten.com
    description: Production Server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/seller/cancel-reasons:
    get:
      tags:
        - Seller / Cancel Reasons
      summary: Get All Cancel Reasons
      description: |
        Mengambil daftar seluruh template alasan pembatalan yang dimiliki oleh toko (Store).

        **Catatan Pengurutan & Pagination:**
        - Data diurutkan berdasarkan `created_at` secara **DESCENDING** (terbaru di atas).
        - Endpoint ini **tidak menggunakan pagination** karena jumlah template alasan pembatalan umumnya sedikit, sehingga lebih efisien jika dikembalikan sekaligus secara keseluruhan (return full list).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CancelReasonItem"
        "404":
          description: Not Found (Toko tidak ditemukan)

    post:
      tags:
        - Seller / Cancel Reasons
      summary: Create Cancel Reason
      description: |
        Membuat template alasan pembatalan baru.

        **Business Logic (Catatan Frontend):**
        - **Auto-Trim:** Spasi berlebih di awal atau akhir string otomatis dibersihkan oleh *backend*.
        - **Anti-Duplikat:** Jika membuat alasan yang teksnya sama persis dengan yang sudah ada di toko ini, *backend* akan menolak dengan status `409 Conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Stok bahan baku habis"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CancelReasonItem"
        "409":
          description: Conflict (Alasan pembatalan dengan teks tersebut sudah ada)

  /api/seller/cancel-reasons/{reasonId}:
    patch:
      tags:
        - Seller / Cancel Reasons
      summary: Update Cancel Reason
      description: |
        Mengubah teks alasan pembatalan. Terdapat perlindungan *Anti-Duplikat* yang sama seperti pada endpoint Create.
      parameters:
        - name: reasonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Stok habis (diperbarui)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CancelReasonItem"
        "404":
          description: Not Found (Template tidak ditemukan atau akses ditolak)
        "409":
          description: Conflict (Teks alasan sudah dipakai)

    delete:
      tags:
        - Seller / Cancel Reasons
      summary: Delete Cancel Reason (Soft Delete)
      description: |
        Menghapus template alasan pembatalan.

        **Business Logic:**
        - Menerapkan mekanisme **Soft Delete** (`is_delete: true`). Data fisik tidak dihapus dari *database* untuk menjaga integritas data pada *history* antrean/pesanan yang sebelumnya sudah pernah dibatalkan menggunakan alasan ini.
      parameters:
        - name: reasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    example: "OK"
        "404":
          description: Not Found

components:
  schemas:
    CancelReasonItem:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
          example: "Stok bahan baku habis"
        created_at:
          type: string
          format: date-time
