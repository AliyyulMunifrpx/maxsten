openapi: 3.0.0

info:
  title: Maxsten API - Dashboard
  version: 1.0.0
  description: Dokumentasi API untuk memuat data overview Dashboard toko, termasuk metrik hari ini, grafik traffic, dan status operasional.

servers:
  - url: https://api.maxsten.com
    description: Production Server

# SUDAH DIREVISI: Menghapus cookieAuth, menambahkan refreshToken
security:
  - bearerAuth: []
  - refreshToken: []

paths:
  /api/stores/dashboard:
    get:
      tags:
        - Dashboard
      summary: Get Dashboard Overview
      description: |
        Mengambil seluruh data yang dibutuhkan untuk halaman utama Dashboard kasir/admin.

        **Business Logic & Analytics (Penting untuk UI/UX):**
        - **Apple-to-Apple Trend:** Nilai `trend` (persentase) membandingkan data hari ini dengan data hari kemarin **pada titik waktu yang sama persis** (misal: Hari ini jam 10:30 pagi akan dibandingkan dengan Kemarin dari jam 00:00 hingga 10:30 pagi).
        - **Average Wait Time:** Metrik `avg_wait_time` dihitung dalam **Menit**. Ini adalah waktu murni dapur/persiapan, dihitung dari status `DIPROSES` hingga `SELESAI` (bukan dari saat pelanggan memesan).
        - **Peak Hour & Traffic:** Puncak keramaian (`peak_hour`) dan grafik 24 jam (`hourly_traffic`) menghitung SEMUA pesanan yang masuk pada hari ini, **KECUALI** yang berstatus `DIBATALKAN`.
        - **Timezone Lock:** Array `hourly_traffic` (index 0 - 23) sudah disesuaikan dengan zona waktu toko (Timezone). Frontend tidak perlu melakukan konversi waktu lokal lagi.
        - **Active Queues:** Daftar `oldest_active_queues` memuat maksimal 5 antrean paling lama (FIFO) yang belum selesai (`BELUM_BAYAR` atau `DIPROSES`).
      responses:
        "200":
          description: OK (Berhasil memuat Dashboard)
          # Menambahkan dokumentasi response header untuk auto-refresh token frontend
          headers:
            x-new-access-token:
              description: Token baru jika token lama expired dan berhasil di-refresh oleh middleware
              schema:
                type: string
            x-new-refresh-token:
              description: Refresh token baru
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
                
        # SUDAH DIREVISI: Menambahkan 401 karena middleware kamu mereturn ini jika token tidak valid
        "401":
          description: Unauthorized (Token tidak ada, invalid, atau gagal refresh)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: "Unauthorized"
                    
        "404":
          description: Not Found (Toko tidak ditemukan)

components:
  # SUDAH DIREVISI: Menambahkan definisi komponen security
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshToken:
      type: apiKey
      in: header
      name: x-refresh-token
      description: "Masukkan refresh token di sini untuk mekanisme auto-refresh token (tanpa cookie)."

  schemas:
    DashboardResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            server_time:
              type: string
              format: date-time
              description: Waktu UTC saat ini di server
            store:
              type: object
              properties:
                public_id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                logo_url:
                  type: string
                  nullable: true
                is_open:
                  type: boolean
                  description: Status buka/tutup toko saat ini (Real-time)
            lists:
              type: object
              properties:
                latest_products:
                  type: array
                  description: 5 Produk terbaru yang ditambahkan
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      price:
                        type: integer
                      image_url:
                        type: string
                      is_available:
                        type: boolean
                      total_sold:
                        type: integer
                        description: Akumulasi total terjual (Status SELESAI)
                latest_addons:
                  type: array
                  description: 5 Add-on terbaru yang ditambahkan
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      price:
                        type: integer
                      addon_group_id:
                        type: string
                oldest_active_queues:
                  type: array
                  description: 5 Antrean terlama yang masih aktif (FIFO)
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      queue_number:
                        type: string
                      status:
                        type: string
                      total_price:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
                      expired_at:
                        type: string
                        format: date-time
                active_queues_count:
                  type: integer
                  description: Total angka seluruh antrean yang sedang aktif
            today:
              type: object
              description: Metrik performa hari ini dengan perbandingan Apple-to-Apple terhadap kemarin.
              properties:
                omzet:
                  $ref: "#/components/schemas/MetricWithTrend"
                pesanan_selesai:
                  $ref: "#/components/schemas/MetricWithTrend"
                pesanan_batal:
                  $ref: "#/components/schemas/MetricWithTrend"
                aov:
                  $ref: "#/components/schemas/MetricWithTrend"
                  description: Average Order Value (Rata-rata nilai per pesanan selesai)
                avg_wait_time:
                  $ref: "#/components/schemas/MetricWithTrend"
                  description: Rata-rata waktu tunggu dapur (dalam Menit)
                peak_hour:
                  type: string
                  example: "12:00 - 13:00"
                  description: Rentang jam paling sibuk. Bernilai "-" jika belum ada pesanan.
                hourly_traffic:
                  type: array
                  description: Array berukuran persis 24 (index 0=Jam 12 malam, index 23=Jam 11 malam) berisi jumlah pesanan masuk.
                  items:
                    type: integer
                  example:
                    [0,0,0,0,0,0,2,5,12,10,8,15,20,18,5,3,4,8,10,12,5,2,0,0]

    MetricWithTrend:
      type: object
      properties:
        value:
          type: integer
          description: Nilai metrik saat ini
        trend:
          type: number
          format: float
          description: Persentase kenaikan/penurunan (Bisa positif, negatif, atau 0).
