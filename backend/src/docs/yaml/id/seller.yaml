openapi: 3.0.0
info:
  title: Maxsten API - Seller (Queue Management)
  version: 1.0.0
  description: Dokumentasi API khusus untuk kasir/penjual dalam mengelola antrean secara real-time.
servers:
  - url: https://api.maxsten.com
    description: Production Server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/stores/{storeId}/queues:
    get:
      tags:
        - Seller / Queue
      summary: Get All Active Queues (With Prefetch)
      description: |
        Mengambil daftar seluruh antrean aktif (`BELUM_BAYAR` dan `DIPROSES`) milik toko.

        **Aturan Pengurutan (Sort Order):**
        - Data diurutkan berdasarkan `created_at` secara **ASCENDING (Terdahulu ke Terbaru)**.
        - Menerapkan prinsip bisnis **FIFO (First In, First Out)** sehingga kasir memproses antrean terlama terlebih dahulu.

        **Catatan Khusus UX (Prefetch Pagination):**
        - Endpoint ini dirancang khusus untuk meminimalisir waktu *loading* di sisi UI. 
        - Setiap *request* memuat 2 halaman sekaligus: `currentPage` (halaman yang sedang dilihat) dan `nextPage` (halaman berikutnya).
        - Saat user berada di halaman 1, UI sudah mendapatkan data halaman 2. Sehingga saat tombol "Next" diklik, data halaman 2 bisa langsung di-*render* tanpa *loading state*.
        - Baru setelah masuk ke halaman 2 secara visual, *Frontend* melempar *request* `page=2` di *background* untuk nge- *prefetch* data halaman 3.
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            description: Public ID dari toko
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueListResponse"
        "404":
          description: Not Found (Store tidak ditemukan atau akses ditolak)

  /api/stores/queues/{queueId}:
    patch:
      tags:
        - Seller / Queue
      summary: Edit Queue Status
      description: |
        Mengubah status pesanan/antrean (misal dari `BELUM_BAYAR` menjadi `DIPROSES`).

        **Aturan Transisi Status (State Machine):**
        - `BELUM_BAYAR` hanya bisa diubah ke `DIPROSES` atau `DIBATALKAN`.
        - `DIPROSES` hanya bisa diubah ke `SELESAI` atau `DIBATALKAN`.
        - `SELESAI` dan `DIBATALKAN` adalah status final dan tidak bisa diubah lagi.

        **Real-Time Trigger (Socket.io):**
        - Jika berhasil, server akan melakukan *emit* ke dua *room* Socket.io: `ANTREAN_{queueId}` (untuk memberi tahu pembeli) dan `TOKO_{storeId}` (untuk sinkronisasi layar kasir lain).
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - storeId
                - status
              properties:
                storeId:
                  type: string
                status:
                  type: string
                  enum: [DIPROSES, SELESAI, DIBATALKAN]
                reason:
                  type: string
                  description: Wajib diisi jika status = DIBATALKAN
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDetailResponse"
        "400":
          description: Bad Request (Transisi status tidak valid)
        "409":
          description: Conflict (Status sudah diubah terlebih dahulu oleh kasir/perangkat lain - Race Condition OCC)

components:
  schemas:
    QueueListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            storeStatus:
              type: object
              properties:
                is_open:
                  type: boolean
                timezone:
                  type: string
            currentPage:
              type: array
              items:
                $ref: "#/components/schemas/QueueItem"
            nextPage:
              type: array
              items:
                $ref: "#/components/schemas/QueueItem"
            pagination:
              type: object
              properties:
                currentPage:
                  type: integer
                limit:
                  type: integer
                  example: 20
                totalRows:
                  type: integer
                totalPages:
                  type: integer

    QueueItem:
      type: object
      properties:
        id:
          type: string
        queue_number:
          type: string
        total_price:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
        note:
          type: string
        queueDetails:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              quantity:
                type: integer
              selected_addons:
                type: string
                description: JSON string
              product:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  price:
                    type: integer
                  image_url:
                    type: string
              variant:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  additional_price:
                    type: integer

    QueueDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            queue_number:
              type: string
            status:
              type: string
            processed_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time
            cancellation_reason:
              type: string
            cancelled_by:
              type: string
              example: "SELLER"
            store_id:
              type: string
            queueDetails:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  quantity:
                    type: integer
                  product:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      price:
                        type: integer
                      image_url:
                        type: string
