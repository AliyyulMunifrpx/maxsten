openapi: 3.0.3
info:
  title: Store Queues API (Seller)
  description: API untuk mengelola daftar antrean (Live Antrean) toko dan memperbarui status antrean oleh kasir/penjual.
  version: 1.0.0
servers:
  - url: https://example.com
    description: Production Server
tags:
  - name: Store Queues
    description: Manajemen antrean toko yang sedang berjalan
paths:
  /api/stores/{storeId}/queues:
    get:
      tags:
        - Store Queues
      summary: Get Store Queues (Live Antrean)
      description: |
        Ambil daftar antrean aktif hari ini untuk toko, plus status buka/tutup toko saat ini. Dipakai untuk halaman kasir atau dashboard *live antrean*.

        **Catatan:**
        - Hanya antrean berstatus `BELUM_BAYAR` atau `DIPROSES` yang muncul (tidak termasuk yang sudah SELESAI/DIBATALKAN).
        - Tidak ada batasan tanggal. Antrean dari sesi malam kemarin yang belum diselesaikan tetap muncul meskipun berganti hari.
        - Data diurutkan secara **FIFO** (`created_at` ascending).
        - `nextPage` adalah data prefetch untuk halaman berikutnya.
        - Status `is_open` dari toko tidak memengaruhi kemunculan antrean (antrean aktif tetap tampil walaupun toko sedang tutup).
      security:
        - cookieAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          description: public_id milik toko
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Nomor halaman (20 antrean per halaman). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      storeStatus:
                        $ref: "#/components/schemas/StoreStatus"
                      currentPage:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"
                      nextPage:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"
                      pagination:
                        $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized (Tidak login / session expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Unauthorized"
        "404":
          description: Not Found (storeId tidak ditemukan / bukan milik user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Store not found or you don't have access"

  /api/stores/queues/{queueId}:
    patch:
      tags:
        - Store Queues
      summary: Update Queue Status
      description: |
        Ubah status sebuah antrean (proses, selesaikan, atau batalkan).
        Perubahan status ini akan otomatis dikirim secara *real-time* ke pembeli melalui *Socket.IO* (`STATUS_UPDATED`).

        **State Machine (Transisi yang diperbolehkan):**
        * `BELUM_BAYAR` -> `DIPROSES`, `DIBATALKAN`
        * `DIPROSES` -> `SELESAI`, `DIBATALKAN`
        * `SELESAI` -> *(status akhir)*
        * `DIBATALKAN` -> *(status akhir)*
      security:
        - cookieAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          description: ID antrean (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Queue"
        "400":
          description: Bad Request (Validasi gagal, atau transisi status tidak diperbolehkan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidTransition:
                  value:
                    errors: "Cannot change the status from BELUM_BAYAR to SELESAI"
                ValidationError:
                  value:
                    errors: '"status" must be one of [DIPROSES, SELESAI, DIBATALKAN]'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found (queueId tidak ditemukan / storeId bukan milik user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "Queue not found"
        "409":
          description: Conflict (Race condition, status sudah terlanjur diubah oleh kasir lain)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors: "The queue status has changed"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Cookie based authentication (membutuhkan `access_token` dan `refresh_token`).

  schemas:
    StoreStatus:
      type: object
      properties:
        is_open:
          type: boolean
          example: true
        timezone:
          type: string
          example: "Asia/Jakarta"

    QueueUpdateInput:
      type: object
      required:
        - storeId
        - status
      properties:
        storeId:
          type: string
          format: uuid
          description: public_id toko pemilik antrean
          example: "8b053812-002e-4738-835d-3a1a11af35a5"
        status:
          type: string
          enum: [DIPROSES, SELESAI, DIBATALKAN]
          description: Status tujuan antrean
          example: "DIBATALKAN"
        reason:
          type: string
          maxLength: 100
          description: Alasan pembatalan. Hanya relevan (dan opsional) jika status adalah DIBATALKAN.
          example: "Stok habis"

    QueueProduct:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Nasi Goreng"
        price:
          type: integer
          example: 20000
        image_url:
          type: string
          nullable: true

    QueueDetail:
      type: object
      properties:
        id:
          type: integer
          example: 900
        quantity:
          type: integer
          example: 1
        selected_addons:
          type: array
          nullable: true
          items:
            type: object
        product:
          $ref: "#/components/schemas/QueueProduct"
        variant:
          type: object
          nullable: true

    Queue:
      type: object
      properties:
        id:
          type: integer
          example: 501
        queue_number:
          type: integer
          example: 12
        total_price:
          type: integer
          example: 15000
        status:
          type: string
          example: "DIPROSES"
        created_at:
          type: string
          format: date-time
          example: "2026-07-27T10:00:00.000Z"
        expired_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-27T11:00:00.000Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
          example: "Stok habis"
        cancelled_by:
          type: string
          nullable: true
          example: "seller"
        note:
          type: string
          nullable: true
        queueDetails:
          type: array
          items:
            $ref: "#/components/schemas/QueueDetail"

    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalRows:
          type: integer
          example: 25
        totalPages:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      properties:
        errors:
          type: string
          example: "Pesan error dari server"
