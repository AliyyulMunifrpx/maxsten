openapi: 3.0.0

info:
  title: Maxsten API - AI Assistant
  version: 1.0.0
  description: Dokumentasi API untuk integrasi Artificial Intelligence (LLM) dalam menghasilkan laporan evaluasi toko dan deskripsi produk otomatis.

servers:
  - url: https://api.maxsten.com
    description: Production Server

# Dipertahankan sebagai fallback; setiap operation di bawah sekarang
# punya security block sendiri supaya nggak gantung ke inheritance root.
security:
  - bearerAuth: []
  - refreshToken: [] # TAMBAHAN: Standarisasi refresh token

paths:
  /api/ai/reports:
    post:
      tags:
        - AI Assistant
      summary: Generate AI Monthly Report
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: |
        Menghasilkan evaluasi dan rekomendasi bisnis dari AI berdasarkan data transaksi bulan tertentu, seperti omzet, AOV, peak hour, dan produk terlaris.

        **Business Logic:**

        - **Timeout 30 Detik:** Request dibatasi maksimal 30 detik di sisi server. Jika AI tidak merespons dalam batas waktu tersebut, API akan mengembalikan `500 Internal Server Error`.
        - **Zero-Data Fallback:** Jika toko tidak memiliki transaksi pada bulan tersebut, API akan merespons secara instan tanpa memanggil AI dengan pesan motivasi standar.
        - **Data Bersih:** Respons dipastikan selalu berupa JSON Object dengan struktur yang konsisten.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  description: Bulan (1-12). Jika dikosongkan, menggunakan bulan saat ini.
                  example: 8

                year:
                  type: integer
                  description: Tahun laporan. Jika dikosongkan, menggunakan tahun saat ini.
                  example: 2026

      responses:
        "200":
          description: Laporan AI berhasil dibuat.
          # TAMBAHAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIReportResponse"

        "400":
          description: Bad Request (Parameter bulan atau tahun tidak valid).
          
        # TAMBAHAN: Error 401 dari middleware
        "401":
          description: Unauthorized (Token tidak valid atau gagal refresh)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: "Unauthorized"

        "500":
          description: Internal Server Error (Provider AI mengalami gangguan, timeout, atau limit habis).

  /api/ai/descriptions:
    post:
      tags:
        - AI Assistant
      summary: Generate Product Description
      # DITAMBAHKAN: security eksplisit per-operation
      security:
        - bearerAuth: []
        - refreshToken: []
      description: |
        Membuat 2 pilihan deskripsi produk otomatis menggunakan AI berdasarkan nama produk.

        **Business Logic:**

        - Request dibatasi maksimal 30 detik.
        - Sistem dilindungi dari Prompt Injection dan AI Hallucination.
        - Jika AI memberikan respons di luar format yang telah ditentukan, API akan mengembalikan `500 Internal Server Error` tanpa menyebabkan crash pada aplikasi frontend.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_name
              properties:
                product_name:
                  type: string
                  description: Nama produk yang akan digunakan sebagai dasar pembuatan deskripsi.
                  example: "Kopi Susu Gula Aren"

      responses:
        "200":
          description: Deskripsi produk berhasil dibuat.
          # TAMBAHAN: Header auto-refresh token
          headers:
            x-new-access-token:
              schema:
                type: string
            x-new-refresh-token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIDescriptionResponse"

        # TAMBAHAN: Error 401 dari middleware
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: "Unauthorized"

        "500":
          description: Internal Server Error (Gagal memproses respons AI atau request mengalami timeout).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      
    # TAMBAHAN: Definisi input refresh token di Swagger UI
    refreshToken:
      type: apiKey
      in: header
      name: x-refresh-token
      description: "Masukkan refresh token di sini untuk mekanisme auto-refresh (tanpa cookie)."

  schemas:
    AIReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            ai_report:
              type: object
              properties:
                greeting:
                  type: string
                  example: "Halo Kak Budi,"

                evaluation:
                  type: string
                  description: Satu paragraf evaluasi singkat dari AI.
                  example: "Performa toko bulan ini sangat baik dengan peningkatan AOV, namun tingkat pembatalan masih cukup tinggi saat jam sibuk."

                recommendations:
                  type: array
                  description: Daftar rekomendasi praktis dari AI.
                  items:
                    type: string
                    example: "Pertimbangkan untuk menambah stok pada hari Jumat karena lonjakan traffic selalu terjadi di hari tersebut."

    AIDescriptionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            recommendations:
              type: array
              description: Maksimal 2 rekomendasi deskripsi produk.
              items:
                type: object
                properties:
                  text:
                    type: string
                    example: "Paduan sempurna espresso murni dan manisnya gula aren asli. Bikin harimu makin semangat tanpa bikin eneg!"

                  score:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: Skor daya tarik deskripsi dari 1 hingga 100.
                    example: 95
